name: pdf-surgeon
version: 1.0.1
description: "Replace a phrase in a digital-born PDF by editing the page content stream in place — font, size, colour, baseline and letter spacing are preserved because they are never touched — and refuse rather than substitute a different typeface. Writes a new .pdf (never an existing file) only after verification passes. Requires text laid out as BT/ET blocks with explicit Tm origins (Word, LibreOffice, Excel, Google Docs); not for scans."
author: Samuek9
kind: backend
python_dependencies:
  - "pymupdf>=1.24.3,<2"
provides_tools:
  - pdf_replace_text